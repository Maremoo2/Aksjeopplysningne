name: Validate Data Connections

on:
  workflow_dispatch:
    inputs:
      usa_data_provider:
        description: "USA data provider"
        required: true
        default: "yahoo"
        type: choice
        options:
          - yahoo
          - alpaca
      nordic_universe:
        description: "Nordic universe"
        required: true
        default: "all"
        type: choice
        options:
          - large_caps
          - momentum
          - norway
          - sweden
          - denmark
          - finland
          - small_caps
          - all

jobs:
  validate-data-connections:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.ALPACA_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRET }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY || secrets.ALPACA_API_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET || secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate data connections
        env:
          USA_DATA_PROVIDER: ${{ github.event.inputs.usa_data_provider }}
          NORDIC_UNIVERSE: ${{ github.event.inputs.nordic_universe }}
        run: |
          python scripts/validate_data_connections.py \
            --outdir reports/data_quality \
            --usa-data-provider "$USA_DATA_PROVIDER" \
            --nordic-universe "$NORDIC_UNIVERSE"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-validation
          path: reports/data_quality/
          if-no-files-found: error
