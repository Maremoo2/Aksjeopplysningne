name: Momentum Screener

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    # 14:45 Europe/Oslo summer time = 12:45 UTC.
    # 14:45 Europe/Oslo winter time = 13:45 UTC.
    - cron: "45 12 * * 1-5"

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repository scope check
        run: |
          python scripts/repo_scope_check.py

      - name: Run watchlist screener
        run: |
          mkdir -p reports/watchlist
          python screener.py --source watchlist --input watchlist.csv --outdir reports/watchlist
          latest_watchlist_csv=$(ls -t reports/watchlist/momentum_report_*.csv | head -n 1)
          python strategy_engine.py --input "$latest_watchlist_csv" --outdir reports/watchlist

      - name: Run Yahoo-all screener
        run: |
          mkdir -p reports/yahoo-all
          python screener.py --source yahoo-all --limit 25 --outdir reports/yahoo-all
          latest_yahoo_csv=$(ls -t reports/yahoo-all/momentum_report_*.csv | head -n 1)
          python strategy_engine.py --input "$latest_yahoo_csv" --outdir reports/yahoo-all
        continue-on-error: true

      - name: Run market regime analysis
        run: |
          mkdir -p reports/regime
          python market_regime.py --outdir reports/regime
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: momentum-reports
          path: reports/
          if-no-files-found: error
