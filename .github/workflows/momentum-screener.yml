name: Momentum Screener

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Market to screen"
        required: true
        default: "usa"
        type: choice
        options:
          - usa
          - nordic
          - global
      nordic_universe:
        description: "Nordic universe"
        required: false
        default: "large_caps"
        type: choice
        options:
          - large_caps
          - momentum
          - norway
          - sweden
          - denmark
          - finland
          - small_caps
          - all
      usa_data_provider:
        description: "USA data provider"
        required: false
        default: "yahoo"
        type: choice
        options:
          - yahoo
          - alpaca
      rescan_type:
        description: "Run type"
        required: true
        default: "open"
        type: choice
        options:
          - open
          - midday
          - close
          - manual
      validate_connections:
        description: "Validate data connections before running screener"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # GitHub cron uses UTC.
    # 14:45 Europe/Oslo summer time = 12:45 UTC.
    # 14:45 Europe/Oslo winter time = 13:45 UTC.
    - cron: "45 12 * * 1-5"

jobs:
  run-screener:
    runs-on: ubuntu-latest
    env:
      RUN_MARKET: ${{ github.event.inputs.market || 'usa' }}
      NORDIC_UNIVERSE: ${{ github.event.inputs.nordic_universe || 'large_caps' }}
      USA_DATA_PROVIDER: ${{ github.event.inputs.usa_data_provider || 'yahoo' }}
      RUN_TYPE: ${{ github.event.inputs.rescan_type || 'open' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.ALPACA_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPACA_SECRET }}
      ALPACA_KEY: ${{ secrets.ALPACA_KEY || secrets.ALPACA_API_KEY }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET || secrets.ALPACA_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Repository scope check
        run: |
          python scripts/repo_scope_check.py

      - name: Validate data connections
        id: validate_data_connections
        if: ${{ github.event.inputs.validate_connections == 'true' }}
        continue-on-error: true
        run: |
          python scripts/validate_data_connections.py \
            --outdir reports/data_quality \
            --usa-data-provider "$USA_DATA_PROVIDER" \
            --nordic-universe "$NORDIC_UNIVERSE"

      - name: Run selected market workflow
        if: ${{ github.event.inputs.validate_connections != 'true' || steps.validate_data_connections.outcome == 'success' }}
        run: |
          set -euo pipefail

          run_market() {
            local market="$1"
            local outdir="$2"
            local source="$3"
            local input_path="${4:-}"

            mkdir -p "$outdir"
            if [ -n "$input_path" ]; then
              python screener.py \
                --market "$market" \
                --run-type "$RUN_TYPE" \
                --source "$source" \
                --usa-data-provider "$USA_DATA_PROVIDER" \
                --input "$input_path" \
                --nordic-universe "$NORDIC_UNIVERSE" \
                --outdir "$outdir" \
                --performance-outdir reports/performance \
                --recommendation-log data/recommendation_log.csv
            else
              python screener.py \
                --market "$market" \
                --run-type "$RUN_TYPE" \
                --source "$source" \
                --usa-data-provider "$USA_DATA_PROVIDER" \
                --limit 25 \
                --nordic-universe "$NORDIC_UNIVERSE" \
                --outdir "$outdir" \
                --performance-outdir reports/performance \
                --recommendation-log data/recommendation_log.csv
            fi

            latest_csv=$(ls -t "$outdir"/momentum_report_*.csv | head -n 1)
            python strategy_engine.py --input "$latest_csv" --outdir "$outdir"
          }

          combine_global_brief() {
            python scripts/combine_global_brief.py --reports-root reports --run-type "$RUN_TYPE"
          }

          mkdir -p reports/performance reports/intraday reports/regime

          if [ "$RUN_TYPE" = "close" ]; then
            python recommendation_tracker.py --mode same-day --input data/recommendation_log.csv --outdir reports/performance
            python recommendation_tracker.py --mode 1w --input data/recommendation_log.csv --outdir reports/performance
          else
            if [ "$RUN_MARKET" = "global" ]; then
              run_market usa reports/usa yahoo-expanded
              run_market nordic reports/nordic watchlist
              combine_global_brief
            elif [ "$RUN_MARKET" = "nordic" ]; then
              run_market nordic reports/nordic watchlist
            else
              run_market usa reports/usa yahoo-expanded
            fi
            python market_regime.py --outdir reports/regime || true
          fi

          python performance_review.py --recommendations data/recommendation_log.csv --outdir reports/performance

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: momentum-reports
          path: |
            reports/
            data/recommendation_log.csv
          if-no-files-found: error

      - name: Upload data quality artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-artifacts
          path: reports/data_quality/
          if-no-files-found: warn

      - name: Fail workflow on validation FAIL
        if: ${{ github.event.inputs.validate_connections == 'true' && steps.validate_data_connections.outcome == 'failure' }}
        run: exit 1
